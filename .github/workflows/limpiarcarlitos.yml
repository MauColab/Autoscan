name: Limpiar rama carlitos

# Ejecutar a mano desde la pestana Actions.
# No clona el repo: trabaja contra la API, no descarga ninguna imagen.
# Saca el dataset, resuelve el conflicto del notebook y escribe el README raiz.
# Dejar "aplicar" en false la primera vez para ver que haria.

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Escribir los cambios (false = solo simulacion)"
        type: boolean
        default: false

permissions:
  contents: write

