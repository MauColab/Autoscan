name: Limpiar rama carlitos

# Ejecutar a mano desde la pestana Actions.
# No clona el repo: trabaja contra la API, no descarga ninguna imagen.
# Dejar "aplicar" en false la primera vez para ver que borraria.

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Escribir los cambios (false = solo simulacion)"
        type: boolean
        default: true

permissions:
  contents: write

