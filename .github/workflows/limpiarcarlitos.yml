name: Limpiar rama carlitos

# Ejecutar a mano desde la pestana Actions de GitHub.
# No clona el repo: trabaja contra la API, asi que no descarga ninguna imagen.
# Dejar "aplicar" en false para ver primero que borraria.

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Escribir los cambios (false = solo simulacion)"
        type: boolean
        default: true

permissions:
  contents: write

